0%{opacity:1;transform:scale(1) rotate(0)}to{opacity:.15;transform:scale(.5) rotate(20deg)}}@keyframes fade{0%{opacity:0}to{opacity:1}}@media(max-width:360px){.stats-bar{gap:8px;padding:8px 10px}.stat-value{font-size:16px}.stat-label{font-size:12px}.stat-icon{font-size:16px}}@media(max-width:420px){.problem-text{font-size:38px}.problem-text.problem-word{font-size:18px}.answer-btn{font-size:26px;padding:16px 0}.fighter-avatar{font-size:48px}.intro-title{font-size:32px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
